<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete"
    />
    <link rel="stylesheet" href="../src/output.css" />
    <script src="../script.js" defer></script>

    <title>DEEP FOCUS-APP</title>
  </head>
  <body
    class="min-h-screen font-Inter bg-gradient-to-br from-gray-100 to-gray-200 bg-no-repeat overflow-hidden"
  >
    <nav
      class="bg-purple-50 h-16 fixed top-0 left-0 w-full flex items-center px-6 shadow-sm justify-between"
    >
      <h1 class="text-3xl font-semibold text-blue-700">DeepFocus</h1>

      <img
        src="../mode-icon2.png"
        alt="theme icon"
        class="w-10 h-10"
        id="theme"
      />
    </nav>
    <main
      class="pt-32 pb-24 flex flex-col items-center text-center mx-4 overflow-hidden"
    >
      <div class="max-w-lg w-full">
        <h1 class="text-5xl font-bold text-blue-700 pb-2">Daily Clarity</h1>
        <p>Elevate your focus, one task at a time.</p>
        <div
          class="mt-7 w-full bg-white flex flex-col p-4 rounded-md shadow-md"
        >
          <input
            type="text"
            name="name"
            id="input-box"
            placeholder="Add a new task...."
            class="w-full bg-gray-200 h-12 px-2 rounded-t-md border border-gray-300 border-solid border-b-2 outline-none"
          />
          <p id="err-msg" class=""></p>
          <button
            type="button"
            id="btn"
            class="mt-4 bg-gradient-to-br from-blue-600 to-amber-700 hover:opacity-90 h-12 rounded-md text-white"
          >
            Add Task
          </button>
        </div>
        <ul
          id="list-container"
          class="max-h-72 overflow-y-auto no-scrollbar pb-24"
        >
          <!-- <li class="checked">ade</li> -->
        </ul>
      </div>
    </main>

    <footer
      class="fixed left-1/2 -translate-x-1/2 bottom-0 flex justify-center max-w-lg w-full bg-gray-200 rounded-md"
    >
      <div
        class="max-w-md w-full flex p-4 rounded-md justify-between text-gray-500"
      >
        <p id="task-count">Task Left</p>
        <p>
          <a
            href="#"
            class="text-blue-600 border-b-2 border-blue-600"
            id="All-task"
            >All</a
          >
        </p>
        <p>
          <a
            id="completed"
            href="#"
            class="hover:text-blue-600 hover:border-b-2 border-blue-600"
            >Completed</a
          >
        </p>
      </div>
    </footer>
  </body>
</html>
